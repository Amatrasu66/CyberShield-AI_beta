<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShield — Cybersecurity Platform</title>
    <meta name="description" content="CyberShield is a cybersecurity platform for security assessments, threat intelligence, and guided remediation — scan, analyze, and act with confidence." />
    <meta name="theme-color" content="#13131b" />
    <script>
      (function () {
        try {
          var k = 'cybershield-theme';
          var r = localStorage.getItem(k);
          var p = r === 'light' || r === 'dark' || r === 'system' ? r : 'dark';
          var e = p !== 'system' ? p : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          if (e === 'dark') root.classList.add('dark');
          else root.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
